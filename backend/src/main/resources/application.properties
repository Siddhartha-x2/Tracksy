server.address=${SERVER_ADDRESS:${TRACKSY_BIND_ADDRESS:127.0.0.1}}
server.port=${PORT:4000}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=TRACKSY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/tracksy}}
spring.datasource.username=${DB_USER:${DATABASE_USERNAME:tracksy}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:tracksy_local}}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-part-count=8
server.tomcat.max-part-header-size=1024
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-parameter-count=16
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false
tracksy.upload-directory=${TRACKSY_UPLOAD_DIR:${TRACKSY_UPLOAD_DIRECTORY:./data/uploads}}
tracksy.demo.seed=${TRACKSY_DEMO_SEED:true}
tracksy.origins=${APP_ORIGINS:http://localhost:4000,http://127.0.0.1:4000,http://localhost:5173,http://127.0.0.1:5173}
tracksy.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
tracksy.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
tracksy.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Administrator}
tracksy.bootstrap.faculty-email=${BOOTSTRAP_FACULTY_EMAIL:}
tracksy.bootstrap.faculty-password=${BOOTSTRAP_FACULTY_PASSWORD:}
tracksy.bootstrap.faculty-name=${BOOTSTRAP_FACULTY_NAME:Faculty guide}
